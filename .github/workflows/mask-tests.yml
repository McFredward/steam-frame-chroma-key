name: Explicit mask checks
on:
  push:
    branches: [dev]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mask-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mask:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install small native test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends glslc spirv-tools libvulkan-dev mesa-vulkan-drivers g++-mingw-w64-x86-64-win32 binutils-aarch64-linux-gnu
      - name: Configure and build
        run: |
          cmake -S . -B build/mask -DCMAKE_BUILD_TYPE=RelWithDebInfo -DFRAME_MASK_BUILD_RECEIVER_OBSERVER=ON -DFRAME_MASK_BUILD_PIXEL_SNAPSHOT=ON
          cmake --build build/mask --parallel 4
      - name: Focused checks in parallel
        run: ctest --test-dir build/mask --output-on-failure --parallel 4
      - name: Windows sender cross-build
        run: x86_64-w64-mingw32-g++-win32 -std=c++17 -O2 -Wall -Wextra -Werror -static-libgcc -static-libstdc++ -I. tools/mask_endpoint.cpp mask/mask_protocol.cpp -lws2_32 -o build/mask_endpoint.exe
      - name: Protocol memory and undefined-behavior checks
        run: |
          g++ -std=c++17 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer -I. mask/mask_protocol.cpp tests/test_mask_protocol.cpp -o build/test-mask-sanitized
          build/test-mask-sanitized
